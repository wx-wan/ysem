version: '3.8'

services:
  # 后端 API 服务（使用 SQLite，与本地开发一致的单一数据库文件）
  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: ysem-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "file:/app/prisma/dev.db"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - server_data:/app/prisma      # 持久化 SQLite 数据库文件
      - server_uploads:/app/uploads  # 持久化上传文件
    ports:
      - "3000:3000"

  # 前端 Web 服务
  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: ysem-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  server_data:
    driver: local
  server_uploads:
    driver: local
